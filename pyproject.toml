[project]
name = "proyecto-integrador"
version = "0.1.0"
description = "Proyector Integrador de la capacitación de python tras completar los 20 módulos, dicho proyecto contiene un servicio de orders con arquitectura hexagonal."
authors = [
    {name = "aemusAxity",email = "aerin.mex@axity.com"}
]
readme = "README.md"
requires-python = ">=3.12, <4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy (>=2.1.1,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx2 (>=2.13.1,<3.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "app"}]

[tool.ruff]
exclude = ["alembic"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
exclude = ["alembic"]
